name: Execute capstone notebooks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capstone-notebook-execution
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert ipykernel
      - name: Generate synthetic dataset
        run: python scripts/generate_synthetic_dataset.py
      - name: Execute notebooks in order
        env:
          MPLBACKEND: Agg
        run: |
          set -e
          for notebook in \
            notebooks/01_business_understanding_and_eda.ipynb \
            notebooks/02_feature_preparation.ipynb \
            notebooks/03_model_training_and_evaluation.ipynb \
            notebooks/04_inferential_analysis.ipynb
          do
            echo "Executing $notebook"
            jupyter nbconvert --to notebook --execute --inplace \
              --ExecutePreprocessor.timeout=900 \
              --ExecutePreprocessor.kernel_name=python3 \
              "$notebook"
          done
      - name: Commit executed notebooks, data and charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks data/raw data/processed images
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Execute all capstone notebooks and save outputs"
            git push origin HEAD:main
          fi
