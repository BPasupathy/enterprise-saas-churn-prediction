name: Validate Vercel dashboard
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - ".github/workflows/validate-vercel.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - ".github/workflows/validate-vercel.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run build
